  <rect x="18" y="28" width="3" height="14" rx="1.5" fill="#386B40"/>
  <!-- Chân tủ -->
  <rect x="18" y="56" width="6" height="4" rx="1" fill="#386B40"/>
  <rect x="40" y="56" width="6" height="4" rx="1" fill="#386B40"/>
</svg>
